name: Build EEcircuit APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # النسخة الأولى العامة (فرع gen1): لا تحتاج أي حزمة خاصة
      - uses: actions/checkout@v4
        with:
          repository: eelab-dev/EEcircuit
          ref: gen1
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and build web
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Add Capacitor and Android
        working-directory: app
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init EEcircuit com.shahen.eecircuit --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EEcircuit-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
