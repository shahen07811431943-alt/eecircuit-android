name: Build EEcircuit APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # النسخة الأولى العامة (فرع gen1): لا تحتاج أي حزمة خاصة
      - uses: actions/checkout@v4
        with:
          repository: eelab-dev/EEcircuit
          ref: gen1
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # استبدال محرر Monaco (لا يدعم الهواتف) بمحرر نص عادي يدعم النسخ واللصق
      - name: Replace editor with textarea
        working-directory: app
        run: |
          cat > src/editor/editorCustom.tsx <<'EOF_EDITOR'
          import React, { useEffect, useState } from "react";

          type EditorCustomType = {
            value?: string;
            language?: string;
            modelChangedContent?: unknown;
            valueChanged?: (value: string | undefined) => void;
            theme?: "light" | "dark";
            line?: number;
            width?: string;
            height?: string;
            options?: object;
          };

          const EditorCustom = ({
            value,
            valueChanged,
            theme,
            width,
            height,
          }: EditorCustomType) => {
            const [text, setText] = useState<string>(value ?? "");

            useEffect(() => {
              if (value !== undefined && value !== text) {
                setText(value);
              }
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [value]);

            const dark = theme === "dark";

            return (
              <textarea
                value={text}
                onChange={(e) => {
                  setText(e.target.value);
                  if (valueChanged) valueChanged(e.target.value);
                }}
                spellCheck={false}
                autoCapitalize="off"
                autoCorrect="off"
                autoComplete="off"
                wrap="off"
                style={{
                  display: "block",
                  width: width ?? "100%",
                  height: height ?? "30vh",
                  boxSizing: "border-box",
                  padding: "8px",
                  fontFamily: "monospace",
                  fontSize: "14px",
                  whiteSpace: "pre",
                  overflow: "auto",
                  resize: "none",
                  border: "1px solid #888",
                  borderRadius: "4px",
                  background: dark ? "#1e1e1e" : "#ffffff",
                  color: dark ? "#d4d4d4" : "#000000",
                }}
              />
            );
          };

          export default React.memo(EditorCustom);
          EOF_EDITOR

      - name: Install and build web
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Add Capacitor and Android
        working-directory: app
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init EEcircuit com.shahen.eecircuit --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EEcircuit-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
