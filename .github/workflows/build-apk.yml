name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # مستودع حزمة المخطط (غيّره إلى مستودعك الخاص إن وُجد)
  SCHEMATIC_REPO: eelab-dev/EEcircuit-schematic

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SCHEMATIC_REPO }}
          path: EEcircuit-schematic
          token: ${{ secrets.SCHEMATIC_TOKEN || github.token }}

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls repo/*.zip | head -n 1)
          echo "Using $ZIP"
          mkdir tmp && unzip -q "$ZIP" -d tmp
          # يدعم الحالتين: الملفات في الجذر أو داخل مجلد
          PKG=$(find tmp -maxdepth 2 -name package.json -not -path '*/node_modules/*' | head -n 1)
          [ -n "$PKG" ] || { echo "package.json not found in zip"; exit 1; }
          mv "$(dirname "$PKG")" EEcircuit
          ls EEcircuit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packages
        working-directory: EEcircuit
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: EEcircuit
        run: npm run build

      - name: Add Android
        working-directory: EEcircuit
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: EEcircuit/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EEcircuit-apk
          path: EEcircuit/android/app/build/outputs/apk/debug/app-debug.apk
